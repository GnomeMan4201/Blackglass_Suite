name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          pip install pytest

      - name: Compile active source
        run: python -m compileall -q -x '(^|/)(backup_[^/]+|\.venv|venv)(/|$)' .

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No pytest test files present; compile and quickstart workflows are the runtime gates."
          fi

  quality-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install flake8 mypy bandit
      - name: Flake8 advisory
        run: flake8 . --exclude='backup_*,.venv,venv' || true
      - name: Mypy advisory
        run: mypy . --exclude 'backup_.*|\.venv|venv' || true
      - name: Bandit advisory
        run: bandit -r . --exclude './backup_*,./.venv,./venv' || true
      - name: Explain advisory status
        run: echo 'Style, type, and static-security scans are informational; runtime validation remains fail-closed.'
