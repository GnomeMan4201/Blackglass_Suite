name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run tests or source smoke validation
        shell: bash
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest tests/ -v --tb=short
          else
            python -m compileall -q -x '(^|/)(\.venv|venv)(/|$)' .
          fi

      - name: Run quickstart smoke check
        run: bash quickstart.sh

  security-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Generate Bandit advisory report
        run: |
          python -m pip install bandit
          bandit -r . \
            --exclude './.venv,./venv' \
            -f html -o bandit-report.html || true
      - name: Explain advisory status
        run: echo 'Bandit is advisory because this repository intentionally contains red-team patterns; runtime validation remains fail-closed.'
